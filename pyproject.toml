[project]
name = "echo-worker"
version = "0.1.0"
description = "Echo media processing worker (transcription + summary)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "bullmq>=2.0.0",
    "faster-whisper>=1.1.0",
    "httpx>=0.27.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
echo-worker = "echo_worker.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["echo_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
